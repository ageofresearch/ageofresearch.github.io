name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
      - "scripts/validate-cotendo.mjs"
      - "scripts/cotendo-detail-contract.mjs"
      - "scripts/cotendo-preview-contract.mjs"
      - "scripts/validate-paver.mjs"
      - "scripts/yacht-chat/**"
      - "tests/yacht-chat-*.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
      - "scripts/validate-cotendo.mjs"
      - "scripts/cotendo-detail-contract.mjs"
      - "scripts/cotendo-preview-contract.mjs"
      - "scripts/validate-paver.mjs"
      - "scripts/yacht-chat/**"
      - "tests/yacht-chat-*.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check internal links and required pages
        run: node scripts/validate-site.mjs
      - name: Test the yacht chat, Gemini client, UI behavior and optional server adapter
        run: node --test tests/yacht-chat-context.test.mjs tests/yacht-chat-gemini.test.mjs tests/yacht-chat-diagnostics.test.mjs tests/yacht-chat-ui.test.mjs tests/yacht-chat-server.test.mjs

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: site
          include-hidden-files: true
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ready_count=0
          for polling_attempt in {1..12}; do
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "${{ env.PAGES_ARTIFACT_NAME }}")] | length')" || artifact_count=""
            if [[ "$artifact_count" == "1" ]]; then
              ready_count=$((ready_count + 1))
              if (( ready_count >= 2 )); then exit 0; fi
            else
              ready_count=0
            fi
            printf 'Waiting for the uploaded artifact metadata (%s/12).\n' "$polling_attempt"
            sleep 5
          done
          printf 'The uploaded Pages artifact did not become consistently available.\n' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
