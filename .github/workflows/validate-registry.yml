name: Registry validation

# The canonical verification workflow runs in ageofresearch/formagization.
# This imported publishing mirror keeps a manual copy for provenance only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate registry and artifact metadata
        run: node scripts/validate-registry.mjs
