name: Mobile boarding and terrace isolation
on:
  pull_request:
    paths:
      - 'site/tidewater-rocha/mobile.html'
      - 'site/tidewater-rocha/mobile/**'
      - 'site/tidewater-rocha/play.html'
      - 'site/tidewater-rocha/assets/RochaYachtApp-*.js'
      - 'site/tidewater-rocha/assets/RochaYachtState-*.js'
      - 'site/tidewater-rocha/assets/PostFX-*.js'
      - 'site/tidewater-rocha/rocha/luz-de-mar/model.*'
      - 'tests/yacht-mobile-parity.cjs'
      - 'tests/yacht-joystick.cjs'
      - 'tests/yacht-touch-look.test.mjs'
      - 'tests/yacht-terrace.test.mjs'
      - 'tests/yacht-stern-access.test.mjs'
      - 'tests/yacht-stern-flag*'
      - 'tests/yacht-stern-access.cjs'
      - 'tests/yacht-stair-surfaces.test.mjs'
      - 'tests/yacht-stair-surfaces.cjs'
      - 'scripts/build-yacht-terrace.mjs'
      - 'scripts/build-yacht-saloon.mjs'
      - 'scripts/yacht-geometry/**'
      - 'tests/yacht-saloon*'
      - 'tests/yacht-upper*'
      - 'tests/yacht-sun*'
      - 'tests/yacht-bridge*'
      - 'tests/yacht-route-performance-comparison*'
      - 'tests/yacht-performance-statistics.cjs'
      - 'tests/yacht-bow*'
      - 'tests/yacht-guest*'
      - 'tests/yacht-main-deck*'
      - 'tests/yacht-spatial*'
      - 'tests/yacht-gangway*'
      - 'tests/yacht-frame-reader.cjs'
      - 'tests/fixtures/yacht-gangway*'
      - 'tests/fixtures/yacht-finish-patterns.json'
      - 'tests/fixtures/yacht-spatial-pending.json'
      - 'scripts/audit-yacht-*'
      - 'scripts/yacht-spatial-requirements.txt'
      - 'tests/yacht-sightlines.cjs'
      - 'tests/yacht-daylight*'
      - 'tests/yacht-tour-performance.cjs'
      - 'tests/yacht-cold-walk.cjs'
      - 'tests/yacht-readiness.test.mjs'
      - 'scripts/build-yacht-upper.mjs'
      - 'scripts/build-yacht-sun.mjs'
      - 'scripts/build-yacht-upper-interior.mjs'
      - 'scripts/build-yacht-bridge.mjs'
      - 'scripts/build-yacht-bow.mjs'
      - 'scripts/build-yacht-bridge-access.mjs'
      - 'scripts/build-yacht-guest-access.mjs'
      - '.github/workflows/yacht-mobile-parity.yml'
permissions:
  contents: read
jobs:
  boarding-finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/tidewater-rocha
            tests
      - name: Verify boarding finish in the production renderers
        env:
          YACHT_CHECK: ${{ matrix.mode }}
          YACHT_OUTPUT: /tmp/yacht-teak-views
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          python3 -m http.server 8764 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/yacht-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/yacht-gangway-render.cjs
      - name: Save boarding finish frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boarding-finish-${{ matrix.mode }}
          path: /tmp/yacht-teak-views/*.png
          retention-days: 3
  spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/tidewater-rocha
            tests/fixtures
            scripts
      - name: Check actual submitted geometry and recorded source exceptions
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/spatial-libs" -r scripts/yacht-spatial-requirements.txt
          node scripts/audit-yacht-export.mjs "$RUNNER_TEMP/spatial-audit"
          PYTHONPATH="$RUNNER_TEMP/spatial-libs" python3 scripts/audit-yacht-spatial.py "$RUNNER_TEMP/spatial-audit" --check
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        route: [bridge, gangway, cold-walk, bow, access, guest, tour, daylight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/tidewater-rocha
            tests
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.route == 'cold-walk' || matrix.route == 'bridge' || matrix.route == 'bow' || matrix.route == 'access' || matrix.route == 'tour' || matrix.route == 'guest'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: performance-reference
          sparse-checkout: site/tidewater-rocha
      - name: Measure the route on an isolated worker
        env:
          YACHT_CHECK: mobile
          YACHT_PERF_CASE: ${{ matrix.route }}
          YACHT_REFERENCE_BASE: http://127.0.0.1:8765/tidewater-rocha/
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          python3 -m http.server 8764 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/yacht-http.log" 2>&1 &
          for attempt in {1..15}; do
            if curl -fsS --output /dev/null http://127.0.0.1:8764/tidewater-rocha/mobile.html; then break; fi
            sleep 1
          done
          if [ -d performance-reference/site ]; then
            python3 -m http.server 8765 --bind 127.0.0.1 --directory performance-reference/site > "$RUNNER_TEMP/yacht-reference-http.log" 2>&1 &
            for attempt in {1..15}; do
              if curl -fsS --output /dev/null http://127.0.0.1:8765/tidewater-rocha/mobile.html; then break; fi
              sleep 1
            done
          fi
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          case "$YACHT_PERF_CASE" in
            daylight)
              mkdir -p /tmp/yacht-mobile-parity/daylight
              if ! YACHT_TIMINGS=/tmp/yacht-mobile-parity/daylight/timings.json node tests/yacht-daylight.cjs; then
                YACHT_GPU_TIMING=1 YACHT_TIMINGS=/tmp/yacht-mobile-parity/daylight/pass-timings.json node tests/yacht-daylight.cjs
                exit 1
              fi ;;
            tour) node tests/yacht-tour-performance.cjs ;;
            bridge) node tests/yacht-bridge-comparison.cjs ;;
            guest)
              if ! node tests/yacht-guest-access-performance.cjs; then
                # Record the PR base on this worker to diagnose an absolute-budget miss.
                YACHT_BASE="$YACHT_REFERENCE_BASE" YACHT_OUTPUT=/tmp/yacht-mobile-parity/reference \
                  node tests/yacht-guest-access-performance.cjs
                exit 1
              fi ;;
            gangway) node tests/yacht-gangway-performance.cjs ;;
            cold-walk)
              if ! node tests/yacht-cold-walk.cjs; then
                YACHT_COLD_GPU_TIMING=1 node tests/yacht-cold-walk.cjs
                # Compare the unchanged PR base on the same worker, preserving the candidate gate.
                export YACHT_BASE="$YACHT_REFERENCE_BASE" YACHT_OUTPUT=/tmp/yacht-mobile-parity/reference
                YACHT_COLD_GPU_TIMING=1 node tests/yacht-cold-walk.cjs
                node tests/yacht-cold-walk.cjs
                exit 1
              fi ;;
            bow|access) node tests/yacht-route-performance-comparison.cjs "$YACHT_PERF_CASE" ;;
          esac
      - name: Save timing measurements and reference qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.route }}-${{ github.run_attempt }}
          path: /tmp/yacht-mobile-parity/**/*.json
          retention-days: 3
  views:
    runs-on: ubuntu-24.04
    # Browser recovery and visual parity run separately from timing measurements.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/tidewater-rocha
            tests
            scripts
      - name: Verify geometry and navigation
        if: matrix.mode == 'mobile'
        run: |
          npm ci --prefix scripts/yacht-geometry --no-audit --no-fund
          npm run --prefix scripts/yacht-geometry screen-visibility
          git diff --exit-code -- site/tidewater-rocha/mobile/screen-visibility.wasm
          node --test tests/yacht-stern-flag.test.mjs tests/yacht-daylight.test.mjs tests/yacht-touch-look.test.mjs tests/yacht-terrace.test.mjs tests/yacht-stern-access.test.mjs tests/yacht-stair-surfaces.test.mjs tests/yacht-saloon.test.mjs tests/yacht-upper.test.mjs tests/yacht-readiness.test.mjs tests/yacht-sun.test.mjs tests/yacht-upper-interior.test.mjs tests/yacht-bridge.test.mjs tests/yacht-bow.test.mjs tests/yacht-bridge-access.test.mjs tests/yacht-guest-access.test.mjs tests/yacht-main-deck.test.mjs tests/yacht-spatial.test.mjs tests/yacht-gangway-finish.test.mjs tests/yacht-gangway-fidelity.test.mjs tests/yacht-gangway-vr.test.mjs tests/yacht-route-performance-comparison.test.cjs
      - name: Verify browser views and recovery
        env:
          YACHT_CHECK: ${{ matrix.mode }}
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          python3 -m http.server 8764 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/yacht-http.log" 2>&1 &
          for attempt in {1..15}; do
            if curl -fsS --output /dev/null http://127.0.0.1:8764/tidewater-rocha/mobile.html; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/yacht-mobile-parity.cjs
      - name: Save the reference frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gangway-comparison-${{ matrix.mode }}
          path: |
            /tmp/yacht-mobile-parity/*.png
            /tmp/yacht-mobile-parity/*.json
          retention-days: 3
  compare:
    needs: [views, performance, spatial, boarding-finish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: gangway-comparison-*
          path: /tmp/yacht-mobile-parity
          merge-multiple: true
      - name: Compare original geometry and rendered isolation
        env:
          YACHT_CHECK: compare
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/yacht-mobile-parity.cjs
