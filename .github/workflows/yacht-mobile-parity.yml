name: Mobile gangway isolation
on:
  pull_request:
    paths:
      - 'site/tidewater-rocha/mobile.html'
      - 'site/tidewater-rocha/mobile/**'
      - 'site/tidewater-rocha/play.html'
      - 'site/tidewater-rocha/assets/RochaYachtApp-*.js'
      - 'site/tidewater-rocha/assets/RochaYachtState-*.js'
      - 'site/tidewater-rocha/rocha/luz-de-mar/model.*'
      - 'tests/yacht-mobile-parity.cjs'
      - '.github/workflows/yacht-mobile-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/tidewater-rocha
            tests
      - name: Verify the isolated gangway against the walk-chat yacht
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          python3 -m http.server 8764 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/yacht-http.log" 2>&1 &
          for attempt in {1..15}; do
            if curl -fsS --output /dev/null http://127.0.0.1:8764/tidewater-rocha/mobile.html; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/yacht-mobile-parity.cjs
      - name: Save the two reference frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gangway-comparison
          path: /tmp/yacht-mobile-parity/*.png
          retention-days: 3
