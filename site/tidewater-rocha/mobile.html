<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terrazas, interiores, solárium y proa · Luz de Mar</title>
  <link rel="stylesheet" href="./mobile/pasarela.css?v=mobile-forward-1">
</head>
<body>
  <main>
    <iframe id="yacht" title="Luz de Mar · Terrazas, interiores, solárium, proa y camarote de babor" src="./play.html?world=rocha&amp;view=walk-chat&amp;scene=gangway&amp;v=yacht-daylight-6" allow="fullscreen" allowfullscreen></iframe>
    <details id="pilot" hidden>
      <summary>Terraza y salón</summary>
      <section aria-label="Recorrido del yate, sus terrazas y solárium">
        <button type="button" id="cross">Caminar hasta el salón</button>
        <button type="button" id="reset">Volver al inicio</button>
        <label for="scale">Resolución de la escena</label>
        <select id="scale"><option value="1">Completa · 100 %</option><option value="0.5">Reducida · 50 %</option></select>
        <label><input type="checkbox" id="smooth"> Suavizar bordes (MSAA 4×)</label>
        <button type="button" id="compareEdges">Comparar suavizado · 2 × 60 s</button>
        <button type="button" id="compare">Comparar FPS · 2 × 60 s</button>
        <output id="progress" aria-live="off"></output>
        <ul id="results" aria-label="Resultados de rendimiento" aria-live="polite"></ul>
        <div class="stats"><span id="fps">— FPS</span><span id="resolution"></span></div>
      </section>
    </details>
  </main>
  <script type="module" src="./mobile/pasarela.js?v=chair-fidelity-1"></script>
</body>
</html>
